services:
  - type: web
    name: govflow-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
